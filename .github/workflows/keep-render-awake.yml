name: Keep Render backend awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          for attempt in 1 2; do
            curl --fail --show-error --silent --max-time 45 \
              --retry 2 --retry-delay 10 --retry-all-errors \
              https://apnarooms-guwahati.onrender.com/health
            echo ""
            sleep 20
          done
