name: Keep Render backend awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl --fail --show-error --silent --max-time 30 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            https://apnarooms-guwahati.onrender.com/health
